const syl = SYL.map(function (x, k) { return { bg: k < si ? '#4A3728' : (k === si ? '#C69A2B' : '#E5D9C9') }; });
const feedback = phase === 'Oikein' || phase === 'Väärin';
return { segs: segs, syl: syl, value: value, n: current, syllable: SYL[si], sylN: si + 1,
isTavu: phase === 'Tavu', isVastaus: phase === 'Vastaus', isOikein: phase === 'Oikein', isVaarin: phase === 'Väärin',
isInput: phase !== 'Tavu', isFeedback: feedback, inputBorder: feedback ? '#CDBBA4' : '#4A3728',

next: function () {

}, 900);
};

} };
